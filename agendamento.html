<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aula experimental: agenda</title>
<style>
:root{
  --bg:#f3f5f0;--fg:#16201a;--muted:#5d6a62;--card:#fff;--line:#d5dcd3;
  --livre:#1f6f4a;--livre-fg:#fff;--ocupado:#e4e8e2;--ocupado-fg:#8a958d;--erro:#b3261e;
  box-sizing:border-box;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101612;--fg:#e8efe9;--muted:#9aa89e;--card:#18211b;--line:#2b382f;
  --livre:#4cc38a;--livre-fg:#08210f;--ocupado:#212c24;--ocupado-fg:#6b7a70;--erro:#ff8a80}}
:root[data-theme="dark"]{
  --bg:#101612;--fg:#e8efe9;--muted:#9aa89e;--card:#18211b;--line:#2b382f;
  --livre:#4cc38a;--livre-fg:#08210f;--ocupado:#212c24;--ocupado-fg:#6b7a70;--erro:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Trebuchet MS",system-ui,sans-serif}
main{max-width:820px;margin:0 auto}
h1{font:700 1.7rem/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 16px}
.legenda{display:flex;gap:16px;font-size:.9rem;margin-bottom:12px;flex-wrap:wrap}
.legenda i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:6px;text-align:center;border-bottom:1px solid var(--line)}
th{font-weight:600;font-size:.9rem}
th small{display:block;color:var(--muted);font-weight:400}
tbody th{color:var(--muted);font-weight:400;width:64px}
tr:last-child th,tr:last-child td{border-bottom:0}
.slot{width:100%;min-height:36px;border:0;border-radius:6px;font:inherit;font-size:.85rem;cursor:pointer;background:var(--livre);color:var(--livre-fg)}
.slot:hover{filter:brightness(1.1)}
.slot:disabled{background:var(--ocupado);color:var(--ocupado-fg);cursor:not-allowed;filter:none}
.slot:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
#status{min-height:1.5em;margin:12px 0;font-weight:600}
#status.erro{color:var(--erro)}
.reset{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);padding:20px;width:min(92vw,380px)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 4px;font:700 1.25rem Georgia,serif}
label{display:block;margin-top:12px;font-size:.9rem}
input{width:100%;box-sizing:border-box;margin-top:4px;padding:10px;font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.acoes{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.acoes button{padding:10px 16px;border-radius:6px;font:inherit;cursor:pointer;border:1px solid var(--line);background:none;color:var(--fg)}
.acoes button[type=submit]{background:var(--livre);color:var(--livre-fg);border-color:var(--livre);font-weight:600}
.acoes button:disabled{opacity:.6;cursor:wait}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.nav button{background:none;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer}
.nav button:disabled{opacity:.4;cursor:not-allowed}
#semanaTexto{font-weight:600;text-align:center}
</style>
</head>
<body>
<main>
  <h1>Agende sua aula experimental</h1>
  <p class="sub">Grátis e sem cadastro. Escolha um horário livre desta semana.</p>
  <div class="legenda">
    <span><i style="background:var(--livre)"></i>Livre</span>
    <span><i style="background:var(--ocupado)"></i>Ocupado ou já passou</span>
  </div>
  <div class="nav">
    <button id="anterior" type="button">← Anterior</button>
    <span id="semanaTexto"></span>
    <button id="proxima" type="button">Próxima →</button>
  </div>
  <div class="scroll"><table id="grade" aria-label="Horários da semana"></table></div>
  <div id="status" role="status" aria-live="polite"></div>
  <button class="reset" id="reset">Limpar reservas (só para testes)</button>
</main>

<dialog id="modal">
  <form id="form">
    <h2>Confirmar horário</h2>
    <div id="resumo" style="color:var(--muted)"></div>
    <label>Nome <input name="nome" required minlength="2" autocomplete="name"></label>
    <label>E-mail <input name="email" type="email" required autocomplete="email"></label>
    <label>Telefone <input name="telefone" type="tel" required pattern="[0-9 ()+\-]{8,}" title="Use só números, espaços, parênteses ou hífen" autocomplete="tel"></label>
    <div id="erroForm" class="erro" style="color:var(--erro);min-height:1.4em;margin-top:8px"></div>
    <div class="acoes">
      <button type="button" id="cancelar">Cancelar</button>
      <button type="submit" id="confirmar">Reservar</button>
    </div>
  </form>
</dialog>

<script src="script.js"></script>
</body>
</html>
